services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: campus
      POSTGRES_USER: campus_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      RESOURCE_DB_PASSWORD: ${RESOURCE_DB_PASSWORD:?set RESOURCE_DB_PASSWORD}
      WORKFLOW_DB_PASSWORD: ${WORKFLOW_DB_PASSWORD:?set WORKFLOW_DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-campus.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U campus_owner -d campus']
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 768m
    restart: unless-stopped
  resource:
    image: campus-resource:${BUILD_COMMIT:-local}
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        APP: resource-app
    environment:
      DB_URL: jdbc:postgresql://db:5432/campus?currentSchema=resource
      DB_USERNAME: campus_resource
      DB_PASSWORD: ${RESOURCE_DB_PASSWORD:?set RESOURCE_DB_PASSWORD}
      MODULE_KEY: ${MODULE_KEY:?set MODULE_KEY}
      SERVER_PORT: 8081
      BUILD_COMMIT: ${BUILD_COMMIT:-local}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8081/actuator/health]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 640m
    restart: unless-stopped
  workflow:
    image: campus-workflow:${BUILD_COMMIT:-local}
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        APP: workflow-app
    environment:
      DB_URL: jdbc:postgresql://db:5432/campus?currentSchema=workflow
      DB_USERNAME: campus_workflow
      DB_PASSWORD: ${WORKFLOW_DB_PASSWORD:?set WORKFLOW_DB_PASSWORD}
      RESOURCE_URL: http://resource:8081
      WORKFLOW_APPROVAL_STEPS: ${WORKFLOW_APPROVAL_STEPS:-2}
      M2_APPROVAL_TIMEOUT: ${M2_APPROVAL_TIMEOUT:-PT24H}
      M2_FIRST_REVIEWER_IDS: ${M2_FIRST_REVIEWER_IDS:-}
      M2_FINAL_REVIEWER_IDS: ${M2_FINAL_REVIEWER_IDS:-}
      M2_EXPIRY_SCAN_MS: ${M2_EXPIRY_SCAN_MS:-5000}
      MODULE_KEY: ${MODULE_KEY:?set MODULE_KEY}
      SERVER_PORT: 8082
      BUILD_COMMIT: ${BUILD_COMMIT:-local}
    depends_on:
      resource:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8082/actuator/health]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 640m
    restart: unless-stopped
  web:
    image: campus-web:${BUILD_COMMIT:-local}
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80'
    depends_on:
      resource:
        condition: service_healthy
      workflow:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 128m
    restart: unless-stopped
volumes:
  database:

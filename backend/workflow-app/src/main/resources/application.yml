server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: campus-workflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campus?currentSchema=workflow}
    username: ${DB_USERNAME:campus_workflow}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET search_path TO workflow
  flyway:
    schemas: workflow
    default-schema: workflow
workflow:
  resource-url: ${RESOURCE_URL:http://localhost:8081}
  module-key: ${MODULE_KEY}
  retry-delay-ms: ${RETRY_DELAY_MS:5000}
  approval:
    steps: ${WORKFLOW_APPROVAL_STEPS:2}
    timeout: ${M2_APPROVAL_TIMEOUT:PT24H}
    first-reviewer-ids: ${M2_FIRST_REVIEWER_IDS:}
    final-reviewer-ids: ${M2_FINAL_REVIEWER_IDS:}
    expiry-scan-ms: ${M2_EXPIRY_SCAN_MS:5000}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true
info:
  app:
    name: campus-workflow
    commit: ${BUILD_COMMIT:development}
